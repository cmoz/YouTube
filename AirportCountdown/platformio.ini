; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_qtpy_esp32s2]
platform = espressif32
board = adafruit_qtpy_esp32s2
framework = arduino

; Set a much faster upload speed for native USB
upload_speed = 921600
monitor_speed = 115200

; Flags to prevent reset when opening the Serial Monitor
monitor_rts = 0
monitor_dtr = 0

; This is the essential flag to enable the 'Serial' object over USB
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
	;-D ARDUINO_USB_MODE=1 used for USB HID 

lib_deps = 
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit SSD1306@^2.5.14
    fastled/FastLED@^3.10.0
    adafruit/Adafruit BusIO@^1.17.1

